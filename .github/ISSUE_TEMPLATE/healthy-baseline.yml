name: Share a healthy baseline
description: Your car runs well? Share a log so owners of the same engine can compare theirs against a known good curve.
title: "Baseline: "
labels: ["baseline"]
body:
  - type: markdown
    attributes:
      value: |
        In Klemme15, open a log of a **warm** drive on the **Analyse** page and press **Share as a healthy baseline**.
        Klemme15 checks it and saves a `.csv`: attach that file below. It holds only engine values (engine speed, load,
        coolant, air mass, fuel trims): no VIN, no date of the drive, no location.

        A check runs on the file as soon as you submit, comments the result here, and prepares a pull request with
        your engine's community baseline. See [how baselines work](https://github.com/Expos-AI/Klemme15/blob/main/docs/BASELINES.md).
  - type: textarea
    id: file
    attributes:
      label: Baseline file
      description: Drag the .csv file Klemme15 saved into this box.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Why you think it's healthy
      description: Recent quick test result, recent work (new intake boot, crankcase vent valve...), and any modifications (intake, exhaust, tune). Modified cars are welcome but are kept apart from stock ones.
    validations:
      required: true
  - type: input
    id: mileage
    attributes:
      label: Approximate mileage
  - type: checkboxes
    id: ok
    attributes:
      label: Sharing
      options:
        - label: The car runs well, with no fuel or misfire faults that I know of.
          required: true
        - label: I'm happy for this log to be combined with others and shipped with Klemme15 under the project's license.
          required: true
