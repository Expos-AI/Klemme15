# Dependabot: weekly checks for newer versions, and immediate pull requests for security fixes (CVEs).
# Security updates also need "Dependabot security updates" switched on in Settings > Code security.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # Avalonia 12 changes APIs the app uses: it's a planned migration, not a routine bump.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]
      # Microsoft.Data.Sqlite is built against SQLitePCLRaw 2.x; move to 3.x when it does. 2.1.12+ has the patched SQLite.
      - dependency-name: "SQLitePCLRaw*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps arrive together; major versions get their own pull request to review.
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
      avalonia:
        patterns: ["Avalonia*"]

  - package-ecosystem: npm
    directory: "/web/dashboard"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # The dashboard's built files are committed, so npm updates also need 'npm run build' and a commit before the
    # "Phone dashboard" check passes. React and its types move together, or the build breaks.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
