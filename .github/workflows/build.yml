name: build

on:
  push:
  pull_request:

jobs:
  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build (native backend only)
        shell: bash
        run: |
          set -o pipefail
          dotnet build OpenHood.CrossPlatform.slnf -c Release 2>&1 | tee build.log || {
            grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        run: dotnet test tests/OpenHood.Tests -c Release --no-build
      - name: Demo scan through the CLI
        run: dotnet run --project src/OpenHood.Cli -c Release --no-build -- scan --demo --report demo-scan.html

  windows-ediabas:
    name: Windows build with EDIABAS mode
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build app and CLI with EdiabasLib
        shell: bash
        run: |
          set -eo pipefail
          for p in src/OpenHood.App src/OpenHood.Cli; do
            dotnet build "$p" -c Release 2>&1 | tee build.log || {
              grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
              exit 1
            }
          done
          # Prove EDIABAS mode was compiled in, not silently skipped.
          ls src/OpenHood.App/bin/Release/net10.0-windows10.0.26100.0/OpenHood.Ediabas.dll
          ls src/OpenHood.App/bin/Release/net10.0-windows10.0.26100.0/EdiabasLib.dll

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [cross-platform, windows-ediabas]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish app and command-line tool
        shell: bash
        run: |
          set -eo pipefail
          out="publish/OpenHood-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          common="-c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None"
          dotnet publish src/OpenHood.App $common -o "$out"
          dotnet publish src/OpenHood.Cli $common -o "$out/cli"
          cp LICENSE README.md "$out/"
          cd publish
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$(basename "$out").zip" "$(basename "$out")" > /dev/null
          else
            zip -qr "$(basename "$out").zip" "$(basename "$out")"
          fi
          ls -la
      - uses: actions/upload-artifact@v5
        with:
          name: OpenHood-${{ matrix.rid }}
          path: publish/*.zip

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenHood $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Early alpha. Tested against the built-in demo cars; not yet confirmed on a real vehicle. Read-only diagnostics (scan, faults, live data). Please report results from your car: see CONTRIBUTING.md.

          Downloads: unzip and run OpenHood (OpenHood.exe on Windows). The command-line tool is in the cli folder. EDIABAS mode is included in the Windows build.

          macOS: the app is unsigned, so right-click > Open the first time. Linux: chmod +x OpenHood, and add yourself to the dialout group for serial access."
