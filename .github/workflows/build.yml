name: build

on:
  push:
  pull_request:

jobs:
  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build (native backend only)
        shell: bash
        run: |
          set -o pipefail
          dotnet build OpenHood.CrossPlatform.slnf -c Release 2>&1 | tee build.log || {
            grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        run: dotnet test tests/OpenHood.Tests -c Release --no-build
      - name: Demo scan through the CLI
        run: dotnet run --project src/OpenHood.Cli -c Release --no-build -- scan --demo --report demo-scan.html

  windows-ediabas:
    name: Windows build with EDIABAS mode
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build app and CLI with EdiabasLib
        shell: bash
        run: |
          set -eo pipefail
          for p in src/OpenHood.App src/OpenHood.Cli; do
            dotnet build "$p" -c Release 2>&1 | tee build.log || {
              grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
              exit 1
            }
          done
          # Prove EDIABAS mode was compiled in, not silently skipped.
          ls src/OpenHood.App/bin/Release/net10.0-windows10.0.26100.0/OpenHood.Ediabas.dll
          ls src/OpenHood.App/bin/Release/net10.0-windows10.0.26100.0/EdiabasLib.dll

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [cross-platform, windows-ediabas]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish app
        run: dotnet publish src/OpenHood.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v5
        with:
          name: OpenHood-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
