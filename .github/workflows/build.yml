name: build

# Docs-only pushes skip CI. Public repo: standard GitHub-hosted runners are free.
on:
  push:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag and publish (e.g. v0.1.0). Leave empty for a normal build."
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}

jobs:
  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build (native backend only)
        shell: bash
        run: |
          set -o pipefail
          dotnet build Klemme15.CrossPlatform.slnf -c Release 2>&1 | tee build.log || {
            grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Klemme15.Tests -c Release --no-build --logger "console;verbosity=normal" --blame-hang-timeout 3m 2>&1 | tee test.log || {
            grep -E "^\s+Failed |Assert\.|Exception|Expected|Actual|at Klemme15|Aborted|crash|hang|blame" test.log | head -40 | sed 's/^/::error::/'
            tail -n 15 test.log | sed 's/^/::error::tail: /'
            exit 1
          }
      - name: Demo scan through the CLI
        run: dotnet run --project src/Klemme15.Cli -c Release --no-build -- scan --demo --report demo-scan.html

  screenshots:
    name: UI screenshots
    needs: cross-platform
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Render the app with the demo cars
        shell: bash
        run: |
          set -eo pipefail
          dotnet run --project tools/Klemme15.Screenshots -c Release -- "$RUNNER_TEMP/shots" 2>&1 | tee shots.log || {
            grep -E "(error|warning) [A-Z]+[0-9]+|Exception|   at " shots.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
          if [ -s "$RUNNER_TEMP/shots/ui-warnings.txt" ]; then
            head -40 "$RUNNER_TEMP/shots/ui-warnings.txt" | sed 's/^/::warning::/'
          fi
      - name: Publish to the screenshots branch
        shell: bash
        run: |
          cd "$RUNNER_TEMP/shots"
          echo "Screenshots of $GITHUB_SHA, rendered headlessly with the demo cars." > README.md
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "UI screenshots for $GITHUB_SHA"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

  dashboard:
    # The phone dashboard's built files are committed (so .NET builds don't need Node); prove they match the source.
    name: Phone dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check and build
        shell: bash
        working-directory: web/dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Committed build is up to date
        shell: bash
        run: |
          git diff --stat --exit-code -- src/Klemme15.Telemetry/wwwroot || {
            echo "::error::src/Klemme15.Telemetry/wwwroot is out of date: run 'npm run build' in web/dashboard and commit it."
            exit 1
          }

  windows-ediabas:
    # EdiabasLib is built for every OS now; Linux is the cheapest place to prove it compiles in.
    name: Build with EDIABAS mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build app and CLI with EdiabasLib
        shell: bash
        run: |
          set -eo pipefail
          for p in src/Klemme15.App src/Klemme15.Cli; do
            dotnet build "$p" -c Release 2>&1 | tee build.log || {
              grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -30 | sed 's/^/::error::/'
              exit 1
            }
          done
          # Prove EDIABAS mode was compiled in, not silently skipped.
          ls src/Klemme15.App/bin/Release/net10.0/Klemme15.Ediabas.dll src/Klemme15.App/bin/Release/net10.0/EdiabasLib.dll
          ls src/Klemme15.Cli/bin/Release/net10.0/Klemme15.Ediabas.dll

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [cross-platform, windows-ediabas, dashboard]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          # One Mac job builds both Mac downloads: half the Mac minutes, and one runner to wait for.
          - { os: macos-latest, rid: osx-arm64 osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        shell: bash
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish app and command-line tool
        shell: bash
        run: |
          set -eo pipefail
          for rid in ${{ matrix.rid }}; do
            out="publish/Klemme15-${RELEASE_TAG}-${rid}"
            common="-c Release -r ${rid} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None"
            dotnet publish src/Klemme15.App $common -o "$out"
            dotnet publish src/Klemme15.Cli $common -o "$out/cli"
            cp LICENSE README.md "$out/"
            (cd publish
             if [ "$RUNNER_OS" = "Windows" ]; then
               7z a -tzip "$(basename "$out").zip" "$(basename "$out")" > /dev/null
             else
               zip -qr "$(basename "$out").zip" "$(basename "$out")"
             fi)
          done
          ls -la publish
      - uses: actions/upload-artifact@v5
        with:
          name: Klemme15-${{ runner.os }}
          path: publish/*.zip

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$RELEASE_TAG" dist/*.zip --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Klemme15 $RELEASE_TAG" \
            --prerelease \
            --notes-file .github/release-notes.md

  packaging:
    name: Update install recipes (Scoop + winget)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate manifests from the released zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "Klemme15-${RELEASE_TAG}-win-x64.zip" -D /tmp --clobber
          ./scripts/update-packaging.sh "$RELEASE_TAG" "/tmp/Klemme15-${RELEASE_TAG}-win-x64.zip"
      - name: Commit the refreshed manifests
        run: |
          set -eo pipefail
          if git diff --quiet -- bucket packaging/winget; then echo "manifests already current"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bucket packaging/winget
          git commit -m "Packaging: update Scoop and winget manifests for $RELEASE_TAG"
          git push origin HEAD:main
      - name: Compute the plain version (no leading v)
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Submit to winget-pkgs (only if a WINGET_TOKEN secret is configured)
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Expos-AI.Klemme15
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ env.RELEASE_TAG }}
          installers-regex: 'win-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
