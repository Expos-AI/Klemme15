name: probe-ediabas-portable

# Manual check that EdiabasLib builds for every OS (net10.0). Linux only, so it is cheap on minutes.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch EdiabasLib
        run: ./scripts/get-ediabaslib.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build EdiabasLib for net10.0
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Klemme15.EdiabasCore -c Release 2>&1 | tee build.log || {
            grep -E "error [A-Z]+[0-9]+" build.log | sed -E 's#.*/EdiabasLib/##' | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }
          grep -cE "warning [A-Z]+[0-9]+" build.log || true
