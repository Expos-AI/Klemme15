name: CodeQL

# Static analysis (SAST) of the C# code, the dashboard's TypeScript and the workflows themselves. Results appear under
# Security > Code scanning. NOTE: this "advanced" setup replaces GitHub's "default setup"; turn the default setup off
# (Settings > Code security > CodeQL analysis) or this workflow's uploads are rejected.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly, to catch newly published queries against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# without a build: CodeQL reads the sources directly, so EdiabasLib (fetched at build time) isn't needed.
          - { language: csharp, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
          - { language: python, build-mode: none }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
